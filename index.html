<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coches Ciudadela</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f766e"> 
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { -webkit-user-select: none; user-select: none; touch-action: manipulation; overflow: hidden; background-color: #f9fafb; }
        
        .slot-btn:active, .fab-btn:active { transform: scale(0.92); }
        
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0f766e; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* SCROLL FLUIDO */
        #scroll-container {
            display: flex; overflow-x: auto; scroll-behavior: smooth;
            -ms-overflow-style: none; scrollbar-width: none;
        }
        #scroll-container::-webkit-scrollbar { display: none; }
        
        /* Ajuste de columnas (7 exactas) */
        .day-col { flex: 1 0 14.28%; min-width: 44px; display: flex; flex-direction: column; align-items: center; border-right: 1px solid #f3f4f6; }
        .day-col:last-child { border-right: none; }
    </style>
</head>
<body class="min-h-screen font-sans flex flex-col items-center">

    <div class="w-full max-w-md bg-white h-screen shadow-2xl relative flex flex-col overflow-hidden">
        
        <!-- CABECERA CON IMAGEN RECORTADA Y BOTÓN FLOTANTE -->
        <header class="relative shrink-0 w-full z-30">
            <!-- Imagen Hero recortada -->
            <div class="w-full h-[150px] relative overflow-hidden bg-gray-100">
                <img src="27989.jpg" alt="Portada" class="w-full h-[220px] object-cover object-[center_60%] absolute top-[-35px]">
                <!-- Degradado suave inferior para fusionar con la tabla -->
                <div class="absolute inset-x-0 bottom-0 h-10 bg-gradient-to-t from-white to-transparent"></div>
            </div>
            
            <!-- Botón Sincronizar FLOTANTE SOBRE LA IMAGEN -->
            <button onclick="cargarDatos(true)" class="absolute top-4 right-4 w-9 h-9 flex items-center justify-center rounded-full bg-white/70 backdrop-blur-md hover:bg-white border border-white/50 transition active:scale-95 shadow-md z-40">
                <i id="sync-icon" class="fas fa-sync-alt text-teal-800 text-sm"></i>
                <div id="sync-loader" class="loader absolute hidden border-gray-200 border-t-teal-800 border-[3px] w-4 h-4"></div>
            </button>
        </header>

        <!-- CONTENEDOR PRINCIPAL (Tabla) -->
        <main class="flex-1 flex flex-col w-full relative z-20"> 
            
            <!-- Zona Superior: Coches Fijos Izq + Días Deslizables Der -->
            <div class="flex-1 flex w-full relative bg-white shadow-sm">
                
                <!-- COLUMNA FIJA IZQUIERDA (Imágenes Coches al 100%) -->
                <div class="w-[86px] flex-shrink-0 flex flex-col bg-white border-r border-gray-200 z-20 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)]">
                    <div class="h-[52px] w-full border-b border-gray-200 bg-gray-50"></div>
                    <div id="fixed-cars-col" class="flex flex-col"></div>
                </div>

                <!-- ÁREA DESLIZABLE (Calendario de 7 columnas exactas) -->
                <div id="scroll-container" class="flex-1 relative bg-white">
                    <div id="calendar-grid" class="flex w-full"></div>
                </div>
            </div>

            <!-- Flechas de Navegación (Alineadas con el calendario) -->
            <div class="w-full h-12 bg-white border-y border-gray-200 flex items-center z-30 shadow-sm relative">
                <!-- Espaciador invisible con el mismo ancho que la columna de coches -->
                <div class="w-[86px] flex-shrink-0 border-r border-gray-100 h-full"></div>
                
                <!-- Controles alineados debajo de las columnas de días -->
                <div class="flex-1 flex justify-between items-center px-1">
                    <button onclick="scrollSieteDias(-1)" class="w-10 h-10 flex items-center justify-center text-teal-700 hover:bg-gray-100 rounded-full active:scale-90 transition">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-[0.2em]">Semana</span>
                    <button onclick="scrollSieteDias(1)" class="w-10 h-10 flex items-center justify-center text-teal-700 hover:bg-gray-100 rounded-full active:scale-90 transition">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
            
            <!-- Relleno inferior para los botones flotantes -->
            <div class="h-[80px] w-full bg-gray-50"></div>
        </main>

        <!-- AVISO DE CARGA FLOTANTE -->
        <div id="floating-loader" class="fixed bottom-[96px] right-6 bg-gray-800 text-white px-4 py-2.5 rounded-full shadow-lg flex items-center justify-center text-xs font-semibold transition-opacity duration-300 z-50 opacity-0 hidden pointer-events-none border border-gray-700">
            <i class="fas fa-spinner fa-spin mr-2 text-teal-400 text-sm"></i> Cargando...
        </div>

        <!-- BOTONES FLOTANTES INFERIORES -->
        <div class="absolute bottom-6 left-0 w-full px-6 flex justify-between items-end z-50 pointer-events-none">
            
            <!-- BOTÓN HOY (Izquierda) -->
            <button onclick="irAHoy()" class="fab-btn pointer-events-auto bg-white text-teal-700 font-black px-5 py-3.5 rounded-full shadow-[0_8px_15px_rgba(0,0,0,0.15)] flex items-center justify-center hover:bg-gray-50 transition border border-gray-200">
                HOY
            </button>

            <!-- BOTÓN AÑADIR VIAJE (Derecha) -->
            <button onclick="abrirViajeModal()" class="fab-btn pointer-events-auto bg-teal-700 text-white px-6 py-3.5 rounded-full shadow-[0_8px_15px_rgba(15,118,110,0.3)] flex items-center justify-center hover:bg-teal-800 transition border-2 border-white/20">
                <i class="fas fa-route text-lg mr-2"></i>
                <span class="text-sm font-bold uppercase tracking-widest">Viaje</span>
            </button>
            
        </div>
    </div>

    <!-- === MODALES === -->

    <!-- MODAL RESERVA -->
    <div id="reservaModal" class="hidden fixed inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b pb-2 border-gray-100">
                <h2 id="modalTitle" class="text-xl font-bold text-teal-800">Reserva</h2>
                <button onclick="cerrarModal('reservaModal')" class="text-gray-400 text-2xl">&times;</button>
            </div>
            
            <div id="avisoTallerBox" class="hidden mb-4 bg-amber-50 border-l-4 border-amber-700 p-3 rounded-lg text-sm text-amber-900">
                <strong class="flex items-center mb-1"><i class="fas fa-tools mr-2 text-amber-700"></i> Observación de Taller</strong>
                <p id="avisoTallerText" class="italic"></p>
            </div>

            <div class="mb-5 text-gray-700 bg-gray-50 p-3 rounded-lg text-sm flex items-center">
                <div class="w-16 h-10 mr-3 bg-white rounded flex justify-center items-center overflow-hidden mix-blend-multiply">
                    <img id="modalCocheImg" src="" alt="Coche" class="w-full h-full object-contain scale-110">
                </div>
                <div>
                    <p><strong id="modalCocheName"></strong></p>
                    <p class="mt-0.5"><i class="far fa-calendar-alt text-teal-600 mr-1"></i> <span id="modalFecha"></span> (<span id="modalTurno" class="font-semibold"></span>)</p>
                </div>
            </div>
            <form id="formReserva" onsubmit="enviarReservaNormal(event)">
                <input type="text" id="inputNombre" placeholder="Tu Nombre o Horario..." class="w-full mb-2 border-2 border-gray-200 rounded-xl p-3 text-lg focus:border-teal-600 focus:outline-none">
                <p class="text-[11px] text-gray-500 mb-4">Déjalo en blanco para eliminar la reserva.</p>
                <button type="submit" id="btnConfirmarReserva" class="w-full bg-teal-700 text-white font-bold py-3 rounded-xl mb-2 flex justify-center items-center">Guardar</button>
            </form>
        </div>
    </div>

    <!-- MODAL DATOS COCHE -->
    <div id="infoCocheModal" class="hidden fixed inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl max-h-[90vh] flex flex-col">
            
            <div class="relative flex flex-col items-center justify-center mb-2 border-b border-gray-100 pb-3">
                <div class="w-32 h-20 bg-white rounded-lg p-1 flex items-center justify-center mb-2 overflow-hidden mix-blend-multiply">
                    <img id="infoCocheImg" src="" alt="Coche" class="w-full h-full object-contain scale-110">
                </div>
                <h3 class="text-lg font-bold text-gray-800 text-center" id="infoCocheTitle">Datos Vehículo</h3>
                
                <button id="btnConfigCoche" onclick="toggleEditCoche()" class="absolute right-0 top-0 text-gray-400 hover:text-teal-600 text-xl transition p-2">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
            
            <div id="infoCocheContent" class="text-gray-600 text-sm bg-gray-50 p-3 rounded-xl border border-gray-100 flex-1 overflow-y-auto mb-4 mt-2"></div>
            
            <div id="infoCocheActions">
                <button onclick="abrirTallerModal()" class="w-full bg-amber-50 border border-amber-200 text-amber-800 hover:bg-amber-100 font-bold py-3 rounded-xl transition flex items-center justify-center mb-2">
                    <i class="fas fa-tools mr-2"></i> Observación Taller
                </button>
                <button onclick="cerrarModal('infoCocheModal')" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 rounded-xl transition">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- MODAL VIAJE -->
    <div id="viajeModal" class="hidden fixed inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-3 border-b pb-2 border-gray-100">
                <h2 class="text-xl font-bold text-teal-800"><i class="fas fa-route mr-2"></i>Añadir Viaje</h2>
                <button onclick="cerrarModal('viajeModal')" class="text-gray-400 text-2xl">&times;</button>
            </div>
            <form onsubmit="enviarViaje(event)">
                <div class="mb-3">
                    <label class="text-xs font-bold text-gray-500 uppercase">Coche</label>
                    <select id="viajeCoche" class="w-full border border-gray-300 p-2 rounded-lg bg-white mt-1 font-medium"></select>
                </div>
                <div class="mb-3">
                    <label class="text-xs font-bold text-gray-500 uppercase">Nombre / Conductor</label>
                    <input type="text" id="viajeNombre" required class="w-full border border-gray-300 p-2 rounded-lg mt-1">
                </div>
                <div class="flex gap-2 mb-3">
                    <div class="w-1/2">
                        <label class="text-xs font-bold text-gray-500 uppercase">Inicio</label>
                        <input type="date" id="viajeFechaIn" required class="w-full border border-gray-300 p-2 rounded-lg mt-1 text-sm">
                        <select id="viajeTurnoIn" class="w-full border border-gray-300 p-2 rounded-lg mt-1 text-sm"><option>Mañana</option><option>Tarde</option></select>
                    </div>
                    <div class="w-1/2">
                        <label class="text-xs font-bold text-gray-500 uppercase">Fin</label>
                        <input type="date" id="viajeFechaFin" required class="w-full border border-gray-300 p-2 rounded-lg mt-1 text-sm">
                        <select id="viajeTurnoFin" class="w-full border border-gray-300 p-2 rounded-lg mt-1 text-sm"><option>Mañana</option><option>Tarde</option></select>
                    </div>
                </div>
                <button type="submit" class="w-full bg-teal-700 text-white font-bold py-3 rounded-xl mt-2 flex justify-center items-center">Guardar Viaje</button>
            </form>
        </div>
    </div>

    <!-- MODAL TALLER -->
    <div id="tallerModal" class="hidden fixed inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl border-[3px] border-amber-700">
            <div class="flex justify-between items-center mb-3 border-b pb-2 border-amber-100">
                <h2 class="text-xl font-bold text-amber-800">
                    <span id="tallerMainTitleText"><i class="fas fa-tools mr-2"></i>Taller:</span> 
                    <span id="tallerCocheNameText" class="ml-1 text-lg"></span>
                </h2>
                <button onclick="cerrarModal('tallerModal')" class="text-gray-400 text-2xl">&times;</button>
            </div>
            <form onsubmit="enviarTaller(event)">
                <div class="mb-3">
                    <label class="text-xs font-bold text-gray-500 uppercase">Observación</label>
                    <textarea id="tallerObs" required class="w-full border border-gray-300 p-2 rounded-lg mt-1 focus:border-amber-500 focus:outline-none" rows="2" placeholder="Ej: Cambio de aceite..."></textarea>
                </div>
                <div class="flex gap-2 mb-4">
                    <div class="w-1/2">
                        <label class="text-xs font-bold text-gray-500 uppercase">Inicio Espera</label>
                        <input type="date" id="tallerFechaIn" required class="w-full border border-gray-300 p-2 rounded-lg mt-1 text-sm focus:border-amber-500 focus:outline-none">
                        <select id="tallerTurnoIn" class="w-full border border-gray-300 p-2 rounded-lg mt-1 text-sm focus:border-amber-500 focus:outline-none"><option>Mañana</option><option>Tarde</option></select>
                    </div>
                    <div class="w-1/2">
                        <label class="text-xs font-bold text-gray-500 uppercase">Fin Espera</label>
                        <input type="date" id="tallerFechaFin" required class="w-full border border-gray-300 p-2 rounded-lg mt-1 text-sm focus:border-amber-500 focus:outline-none">
                        <select id="tallerTurnoFin" class="w-full border border-gray-300 p-2 rounded-lg mt-1 text-sm focus:border-amber-500 focus:outline-none"><option>Mañana</option><option>Tarde</option></select>
                    </div>
                </div>
                <div class="flex flex-col gap-2">
                    <button type="submit" id="btnTaller" class="w-full bg-amber-700 hover:bg-amber-800 text-white font-bold py-3 rounded-xl flex items-center justify-center transition">Aplicar Taller</button>
                    <button type="button" id="btnBorrarTaller" onclick="borrarTaller()" class="hidden w-full bg-white border border-amber-200 text-amber-700 hover:bg-amber-50 font-bold py-3 rounded-xl transition flex items-center justify-center">
                        <i class="fas fa-trash-alt mr-2"></i> Quitar del Taller
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7RyhObzV_0lLV4Wc_10BSCvY6Y0iAUWKAJt6gsH641xsEXvQtzPSgb3X_jfuMGXkLgw/exec';
        
        const coches = [
            { id: "BLANCO", alias: "Qashqai Blanco", img: "30492.jpg" },
            { id: "POLO", alias: "Polo", img: "30490.jpg" },
            { id: "KONA", alias: "Kona", img: "30494.jpg" },
            { id: "ATECA", alias: "Ateca", img: "30489.jpg" },
            { id: "GRIS", alias: "Qashqai Gris", img: "30498.jpg" }
        ];

        const diasNombres = ['D', 'L', 'M', 'X', 'J', 'V', 'S']; 
        
        let reservasActivas = new Map();
        let infoCochesGlobal = {}; 
        let currentCocheIdForTaller = "";
        let isEditModeInfo = false; 
        
        let arrayFechas = [];
        let baseDate = new Date();
        baseDate.setHours(0,0,0,0);
        baseDate.setDate(baseDate.getDate() - 15);
        for(let i=0; i<60; i++) {
            let d = new Date(baseDate);
            d.setDate(baseDate.getDate() + i);
            arrayFechas.push(d);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const selectCoche = document.getElementById('viajeCoche');
            coches.forEach(c => selectCoche.innerHTML += `<option value="${c.id}">${c.alias}</option>`);
            
            const hoyIso = new Date().toISOString().split('T')[0];
            document.getElementById('viajeFechaIn').value = hoyIso;
            document.getElementById('viajeFechaFin').value = hoyIso;
            document.getElementById('tallerFechaIn').value = hoyIso;
            document.getElementById('tallerFechaFin').value = hoyIso;
            
            const cache = localStorage.getItem('cochesDataCache');
            if (cache) { 
                procesarDatos(JSON.parse(cache)); 
                cargarDatos(true); 
            } else { 
                cargarDatos(true); 
            }
        });

        document.addEventListener('visibilitychange', () => {
            if(document.visibilityState === 'visible') {
                cargarDatos(false); 
            }
        });

        function cargarDatos(mostrarLoader = false) {
            const floatLoader = document.getElementById('floating-loader');
            const syncIcon = document.getElementById('sync-icon');
            const syncLoader = document.getElementById('sync-loader');
            
            if (mostrarLoader) {
                floatLoader.classList.remove('hidden');
                setTimeout(() => floatLoader.classList.remove('opacity-0'), 10);
                
                syncIcon.classList.add('hidden');
                syncLoader.classList.remove('hidden');
            }
            
            fetch(SCRIPT_URL).then(r => r.json()).then(data => {
                localStorage.setItem('cochesDataCache', JSON.stringify(data));
                procesarDatos(data);
            }).catch(e => console.log("Modo offline")).finally(() => {
                if (mostrarLoader) {
                    floatLoader.classList.add('opacity-0');
                    setTimeout(() => {
                        floatLoader.classList.add('hidden');
                        syncIcon.classList.remove('hidden');
                        syncLoader.classList.add('hidden');
                    }, 300);
                }
            });
        }

        function procesarDatos(data) {
            reservasActivas.clear();
            let arr = data.reservas ? data.reservas : data;
            arr.forEach(res => {
                reservasActivas.set(`${res.coche}_${res.fecha}_${res.turno}`, { 
                    nombre: res.nombre, taller: res.taller, observacion: res.observacion 
                });
            });
            if (data.infoCoches) infoCochesGlobal = data.infoCoches;
            renderApp();
        }

        function getImgForCoche(cocheId) {
            const found = coches.find(c => c.id === cocheId);
            return found ? found.img : "";
        }

        function getAliasForCoche(cocheId) {
            const found = coches.find(c => c.id === cocheId);
            return found ? found.alias : cocheId;
        }

        function irAHoy() {
            const todayStr = new Date().toDateString();
            const todayIndex = arrayFechas.findIndex(d => d.toDateString() === todayStr);
            if(todayIndex !== -1) {
                const diaEl = document.getElementById(`dia-${todayIndex}`);
                if (diaEl) {
                    const container = document.getElementById('scroll-container');
                    container.scrollTo({ left: diaEl.offsetLeft, behavior: 'smooth' });
                }
            }
        }

        function renderApp() {
            const todayStr = new Date().toDateString();
            
            // IMÁGENES AL 100% SIN GLOBO
            let fixedHtml = "";
            coches.forEach(coche => {
                fixedHtml += `
                    <div class="flex items-center justify-center h-[5.5rem] border-b border-gray-100 last:border-b-0 w-full overflow-hidden relative">
                        <button onclick="mostrarDatosCoche('${coche.id}')" class="w-full h-full bg-white active:bg-gray-50 transition flex items-center justify-center focus:outline-none">
                            <img src="${coche.img}" alt="${coche.alias}" class="w-full h-[120%] object-contain mix-blend-multiply scale-110" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100\\' height=\\'100\\'><rect width=\\'100\\' height=\\'100\\' fill=\\'%23eee\\'/></svg>'">
                        </button>
                    </div>`;
            });
            document.getElementById('fixed-cars-col').innerHTML = fixedHtml;

            let gridHtml = "";
            arrayFechas.forEach((fechaObj, index) => {
                const isToday = fechaObj.toDateString() === todayStr;
                const fechaStr = new Date(fechaObj.getTime() - (fechaObj.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                
                const bgClass = isToday ? 'bg-teal-50 border-teal-200' : 'bg-transparent border-gray-100';
                const textClass = isToday ? 'text-teal-800' : 'text-gray-500';
                
                let colHtml = `
                <div class="day-col ${bgClass}" id="dia-${index}">
                    <div class="h-[52px] w-full flex flex-col items-center justify-center border-b border-gray-100">
                        <span class="text-[9px] ${textClass} font-bold tracking-wider">${diasNombres[fechaObj.getDay()]}</span>
                        <span class="text-[13px] font-bold ${textClass}">${fechaObj.getDate()}</span>
                    </div>`;
                
                coches.forEach(coche => {
                    const idM = `${coche.id}_${fechaStr}_Mañana`;
                    const idT = `${coche.id}_${fechaStr}_Tarde`;
                    const resM = reservasActivas.get(idM);
                    const resT = reservasActivas.get(idT);
                    
                    const clickM = `abrirReservaNormal('${coche.id}', '${fechaStr}', 'Mañana', '${fechaObj.toLocaleDateString()}')`;
                    const clickT = `abrirReservaNormal('${coche.id}', '${fechaStr}', 'Tarde', '${fechaObj.toLocaleDateString()}')`;

                    const isResM = resM && resM.nombre !== "";
                    const isResT = resT && resT.nombre !== "";
                    const isTallerM = resM && resM.taller;
                    const isTallerT = resT && resT.taller;

                    let styleM = "rounded-t-full ";
                    let styleT = "rounded-b-full ";

                    if (isResM) {
                        styleM += "bg-[#901a1e] text-white shadow-inner ";
                        if (isTallerM) styleM += "border-[2.5px] border-[#f59e0b] border-b-0 "; 
                        else styleM += "border-2 border-[#2b0000] border-b-0 "; 
                    } else {
                        styleM += "bg-white ";
                        if (isTallerM) styleM += "text-[#b45309] border-[2.5px] border-[#f59e0b] border-b-0 shadow-inner "; 
                        else styleM += "text-teal-700 border-[1.5px] border-teal-500 border-b-0 ";
                    }

                    if (isResT) {
                        styleT += "bg-[#901a1e] text-white shadow-inner ";
                        if (isTallerT) styleT += "border-[2.5px] border-[#f59e0b] border-t-0 ";
                        else styleT += "border-2 border-[#2b0000] border-t-0 ";
                    } else {
                        styleT += "bg-white ";
                        if (isTallerT) styleT += "text-[#b45309] border-[2.5px] border-[#f59e0b] border-t-0 shadow-inner ";
                        else styleT += "text-teal-700 border-[1.5px] border-teal-500 border-t-0 ";
                    }

                    let midLine = `<div class="h-[1px] bg-teal-100 w-[90%] mx-auto"></div>`;
                    if (isTallerM && isTallerT) {
                        midLine = `<div class="h-[2.5px] bg-[#f59e0b] w-full"></div>`; 
                    } else if (isResM && isResT) {
                        midLine = `<div class="h-[1.5px] bg-[#2b0000] w-[95%] mx-auto"></div>`; 
                    }

                    colHtml += `
                        <div class="h-[5.5rem] w-full px-0.5 py-2 flex flex-col border-b border-gray-100 last:border-b-0">
                            <button class="slot-btn flex-1 flex items-center justify-center font-bold text-[10px] transition-colors ${styleM}" onclick="${clickM}">M</button>
                            ${midLine}
                            <button class="slot-btn flex-1 flex items-center justify-center font-bold text-[10px] transition-colors ${styleT}" onclick="${clickT}">T</button>
                        </div>`;
                });
                
                colHtml += `</div>`;
                gridHtml += colHtml;
            });
            document.getElementById('calendar-grid').innerHTML = gridHtml;
            
            if(!window.haCentradoHoy) {
                setTimeout(() => { irAHoy(); window.haCentradoHoy = true; }, 100);
            }
        }

        function scrollSieteDias(direccion) { 
            const container = document.getElementById('scroll-container');
            const widthToScroll = container.clientWidth;
            container.scrollBy({ left: direccion * widthToScroll, behavior: 'smooth' }); 
        }
        
        function cerrarModal(id) { document.getElementById(id).classList.add('hidden'); }

        let reservaPendiente = null;
        function abrirReservaNormal(cocheId, fechaISO, turno, fechaTexto) {
            reservaPendiente = { coche: cocheId, fecha: fechaISO, turno, id: `${cocheId}_${fechaISO}_${turno}` };
            
            document.getElementById('modalCocheName').innerText = getAliasForCoche(cocheId);
            document.getElementById('modalCocheImg').src = getImgForCoche(cocheId);
            document.getElementById('modalFecha').innerText = fechaTexto;
            document.getElementById('modalTurno').innerText = turno;
            
            let resObj = reservasActivas.get(reservaPendiente.id);
            const input = document.getElementById('inputNombre');
            const avisoBox = document.getElementById('avisoTallerBox');
            
            if (resObj && resObj.taller) {
                avisoBox.classList.remove('hidden');
                document.getElementById('avisoTallerText').innerText = resObj.observacion || "En mantenimiento.";
            } else { avisoBox.classList.add('hidden'); }
            
            if (resObj && resObj.nombre !== "") {
                document.getElementById('modalTitle').innerText = "Editar Reserva";
                document.getElementById('modalTitle').className = "text-xl font-bold text-[#901a1e]"; 
                input.value = resObj.nombre;
            } else {
                document.getElementById('modalTitle').innerText = "Nueva Reserva";
                document.getElementById('modalTitle').className = "text-xl font-bold text-teal-800";
                input.value = localStorage.getItem('ultimoNombreCoches') || '';
            }
            document.getElementById('reservaModal').classList.remove('hidden');
        }

        function enviarReservaNormal(e) {
            e.preventDefault();
            const nombre = document.getElementById('inputNombre').value.trim();
            if (nombre !== '') localStorage.setItem('ultimoNombreCoches', nombre); 
            
            let actual = reservasActivas.get(reservaPendiente.id) || { taller: false, observacion: "" };
            actual.nombre = nombre;
            reservasActivas.set(reservaPendiente.id, actual);
            renderApp(); 
            cerrarModal('reservaModal'); 

            fetch(SCRIPT_URL, { 
                method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify([{ fecha: reservaPendiente.fecha, nombre: nombre, coche: reservaPendiente.coche, turno: reservaPendiente.turno }]) 
            }).then(() => { cargarDatos(false); });
        }

        function formatPhone(text) {
            const phoneRegex = /\b(?:(?:\+|00)34[\s.-]?)?[6789](?:[\s.-]?\d){8}\b/g;
            return text.replace(phoneRegex, match => `<a href="tel:${match.replace(/\s+/g, '')}" class="text-blue-600 underline font-bold" onclick="event.stopPropagation()">${match}</a>`);
        }

        function mostrarDatosCoche(cocheId) {
            currentCocheIdForTaller = cocheId; 
            document.getElementById('infoCocheTitle').innerText = getAliasForCoche(cocheId);
            document.getElementById('infoCocheImg').src = getImgForCoche(cocheId);
            
            isEditModeInfo = false; 
            renderInfoCocheContent();
            document.getElementById('infoCocheModal').classList.remove('hidden');
        }

        function toggleEditCoche() {
            isEditModeInfo = !isEditModeInfo;
            renderInfoCocheContent();
        }

        function renderInfoCocheContent() {
            let targetKey = Object.keys(infoCochesGlobal).find(k => k.toLowerCase().includes(currentCocheIdForTaller.toLowerCase()));
            let htmlContent = `<p class="text-center text-gray-500 my-4">Sin datos en Drive.</p>`;
            
            if (targetKey && infoCochesGlobal[targetKey]) {
                if (isEditModeInfo) {
                    let inputs = infoCochesGlobal[targetKey].map((item, index) => `
                        <div class="flex flex-col border-b border-gray-200 border-opacity-60 py-2 last:border-0">
                            <label class="text-[11px] font-bold text-teal-700 uppercase tracking-wide mb-1">${item.label}</label>
                            <input type="text" id="editCocheVal_${index}" value="${item.value || ''}" data-label="${item.label}" class="w-full border border-gray-300 p-2 rounded text-sm focus:border-teal-500 focus:outline-none">
                        </div>
                    `).join('');
                    htmlContent = `
                        <form onsubmit="guardarDatosCoche(event)">
                            <div class="flex flex-col mb-3">${inputs}</div>
                            <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-xl transition shadow-md">Guardar Cambios</button>
                        </form>`;
                    document.getElementById('infoCocheActions').classList.add('hidden');
                } else {
                    let lista = infoCochesGlobal[targetKey].map(item => `
                        <div class="flex justify-between border-b border-gray-200 border-opacity-60 py-2 last:border-0 items-center">
                            <span class="text-[11px] font-bold text-teal-700 uppercase tracking-wide w-5/12 pr-1">${item.label}</span>
                            <span class="text-[12px] font-medium text-gray-700 w-7/12 text-right break-words">${formatPhone(item.value || '-')}</span>
                        </div>
                    `).join('');
                    htmlContent = `<div class="flex flex-col">${lista}</div>`;
                    document.getElementById('infoCocheActions').classList.remove('hidden');
                }
            }
            document.getElementById('infoCocheContent').innerHTML = htmlContent;
            
            const gearBtn = document.getElementById('btnConfigCoche');
            if(isEditModeInfo) { gearBtn.classList.add('text-teal-600'); gearBtn.classList.remove('text-gray-400'); }
            else { gearBtn.classList.add('text-gray-400'); gearBtn.classList.remove('text-teal-600'); }
        }

        function guardarDatosCoche(e) {
            e.preventDefault();
            let targetKey = Object.keys(infoCochesGlobal).find(k => k.toLowerCase().includes(currentCocheIdForTaller.toLowerCase()));
            let datosNuevos = [];
            
            let inputs = document.querySelectorAll('input[id^="editCocheVal_"]');
            inputs.forEach(inp => { datosNuevos.push({ label: inp.getAttribute('data-label'), value: inp.value }); });
            
            infoCochesGlobal[targetKey] = datosNuevos; 
            isEditModeInfo = false;
            renderInfoCocheContent(); 

            const payload = { action: "update_coche", coche: currentCocheIdForTaller, datos: datosNuevos };
            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
            .then(() => { cargarDatos(false); });
        }

        function abrirTallerModal() {
            cerrarModal('infoCocheModal');
            document.getElementById('tallerCocheNameText').innerText = getAliasForCoche(currentCocheIdForTaller);
            
            const hoyIso = new Date().toISOString().split('T')[0];
            let slotsTaller = [];
            arrayFechas.forEach(d => {
                let fStr = d.toISOString().split('T')[0];
                if (fStr >= hoyIso) {
                    let rM = reservasActivas.get(`${currentCocheIdForTaller}_${fStr}_Mañana`);
                    let rT = reservasActivas.get(`${currentCocheIdForTaller}_${fStr}_Tarde`);
                    if(rM && rM.taller) slotsTaller.push({ fecha: fStr, turno: 'Mañana', obs: rM.observacion });
                    if(rT && rT.taller) slotsTaller.push({ fecha: fStr, turno: 'Tarde', obs: rT.observacion });
                }
            });
            
            if (slotsTaller.length > 0) {
                document.getElementById('tallerMainTitleText').innerHTML = `<i class="fas fa-tools mr-2"></i>Modificar Taller:`;
                document.getElementById('tallerFechaIn').value = slotsTaller[0].fecha; document.getElementById('tallerTurnoIn').value = slotsTaller[0].turno;
                document.getElementById('tallerFechaFin').value = slotsTaller[slotsTaller.length-1].fecha; document.getElementById('tallerTurnoFin').value = slotsTaller[slotsTaller.length-1].turno;
                document.getElementById('tallerObs').value = slotsTaller[0].obs || "";
                document.getElementById('btnTaller').innerText = "Actualizar Taller"; document.getElementById('btnBorrarTaller').classList.remove('hidden');
            } else {
                document.getElementById('tallerMainTitleText').innerHTML = `<i class="fas fa-tools mr-2"></i>Nuevo Taller:`;
                document.getElementById('tallerFechaIn').value = hoyIso; document.getElementById('tallerFechaFin').value = hoyIso;
                document.getElementById('tallerObs').value = "";
                document.getElementById('btnTaller').innerText = "Aplicar Taller"; document.getElementById('btnBorrarTaller').classList.add('hidden');
            }
            document.getElementById('tallerModal').classList.remove('hidden');
        }

        function enviarTaller(e) {
            e.preventDefault();
            const obs = document.getElementById('tallerObs').value;
            const fIn = document.getElementById('tallerFechaIn').value; const tIn = document.getElementById('tallerTurnoIn').value;
            const fFin = document.getElementById('tallerFechaFin').value; const tFin = document.getElementById('tallerTurnoFin').value;
            const hoyIso = new Date().toISOString().split('T')[0];

            arrayFechas.forEach(d => {
                let fStr = d.toISOString().split('T')[0];
                if (fStr >= hoyIso) {
                    ['Mañana', 'Tarde'].forEach(t => {
                        let res = reservasActivas.get(`${currentCocheIdForTaller}_${fStr}_${t}`);
                        if (res) { res.taller = false; res.observacion = ""; }
                    });
                }
            });
            let startD = new Date(fIn); let endD = new Date(fFin);
            for(let d = new Date(startD); d <= endD; d.setDate(d.getDate() + 1)) {
                let fStr = d.toISOString().split('T')[0];
                let turnos = [];
                if (d.getTime() === startD.getTime() && d.getTime() === endD.getTime()) {
                    if (tIn === "Mañana" && tFin === "Tarde") turnos = ["Mañana", "Tarde"];
                    else if (tIn === "Tarde" && tFin === "Mañana") {} 
                    else turnos = [tIn];
                } else if (d.getTime() === startD.getTime()) { turnos = (tIn === "Mañana") ? ["Mañana", "Tarde"] : ["Tarde"];
                } else if (d.getTime() === endD.getTime()) { turnos = (tFin === "Mañana") ? ["Mañana"] : ["Mañana", "Tarde"];
                } else { turnos = ["Mañana", "Tarde"]; }
                
                turnos.forEach(t => {
                    let key = `${currentCocheIdForTaller}_${fStr}_${t}`;
                    let res = reservasActivas.get(key) || { nombre: "", taller: false, observacion: "" };
                    res.taller = true; res.observacion = obs;
                    reservasActivas.set(key, res);
                });
            }
            
            renderApp();
            cerrarModal('tallerModal');

            const payload = {
                action: "taller", coche: currentCocheIdForTaller, observacion: obs, fechaHoy: hoyIso,
                inicio: { fecha: fIn, turno: tIn }, fin: { fecha: fFin, turno: tFin }
            };
            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
            .then(() => { cargarDatos(false); });
        }

        function borrarTaller() {
            const hoyIso = new Date().toISOString().split('T')[0];
            
            arrayFechas.forEach(d => {
                let fStr = d.toISOString().split('T')[0];
                if (fStr >= hoyIso) {
                    ['Mañana', 'Tarde'].forEach(t => {
                        let res = reservasActivas.get(`${currentCocheIdForTaller}_${fStr}_${t}`);
                        if (res) { res.taller = false; res.observacion = ""; }
                    });
                }
            });
            renderApp();
            cerrarModal('tallerModal');

            const payload = { action: "borrar_taller", coche: currentCocheIdForTaller, fechaHoy: hoyIso };
            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
            .then(() => { cargarDatos(false); });
        }

        function abrirViajeModal() { document.getElementById('viajeModal').classList.remove('hidden'); }
        
        function enviarViaje(e) {
            e.preventDefault();
            const fIn = document.getElementById('viajeFechaIn').value; const tIn = document.getElementById('viajeTurnoIn').value;
            const fFin = document.getElementById('viajeFechaFin').value; const tFin = document.getElementById('viajeTurnoFin').value;
            const coche = document.getElementById('viajeCoche').value; const nombre = document.getElementById('viajeNombre').value;
            
            let startD = new Date(fIn); let endD = new Date(fFin);
            let payloadArr = [];
            
            for(let d = new Date(startD); d <= endD; d.setDate(d.getDate() + 1)) {
                let fStr = d.toISOString().split('T')[0];
                if (d.getTime() === startD.getTime() && d.getTime() === endD.getTime()) {
                    if (tIn === "Tarde" && tFin === "Mañana") { } 
                    else if (tIn === "Mañana" && tFin === "Tarde") { payloadArr.push({fecha:fStr, turno:"Mañana", coche, nombre}); payloadArr.push({fecha:fStr, turno:"Tarde", coche, nombre}); }
                    else { payloadArr.push({fecha:fStr, turno:tIn, coche, nombre}); }
                } else if (d.getTime() === startD.getTime()) {
                    if (tIn === "Mañana") { payloadArr.push({fecha:fStr, turno:"Mañana", coche, nombre}); payloadArr.push({fecha:fStr, turno:"Tarde", coche, nombre}); }
                    else { payloadArr.push({fecha:fStr, turno:"Tarde", coche, nombre}); }
                } else if (d.getTime() === endD.getTime()) {
                    if (tFin === "Mañana") { payloadArr.push({fecha:fStr, turno:"Mañana", coche, nombre}); }
                    else { payloadArr.push({fecha:fStr, turno:"Mañana", coche, nombre}); payloadArr.push({fecha:fStr, turno:"Tarde", coche, nombre}); }
                } else {
                    payloadArr.push({fecha:fStr, turno:"Mañana", coche, nombre}); payloadArr.push({fecha:fStr, turno:"Tarde", coche, nombre});
                }
            }

            payloadArr.forEach(p => {
                let key = `${p.coche}_${p.fecha}_${p.turno}`;
                let actual = reservasActivas.get(key) || { taller: false, observacion: "" };
                actual.nombre = p.nombre;
                reservasActivas.set(key, actual);
            });
            renderApp();
            cerrarModal('viajeModal');
            document.getElementById('viajeNombre').value = '';

            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payloadArr) })
            .then(() => { cargarDatos(false); });
        }

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(err => console.error(err));
    </script>
