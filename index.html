<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coches Ciudadela</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f766e"> 
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* Bloqueo total del rebote del navegador (Anti-bounce nativo) */
        html, body { 
            width: 100%; height: 100%; margin: 0; padding: 0;
            overflow: hidden; position: fixed; 
            -webkit-user-select: none; user-select: none; touch-action: manipulation; 
            background-color: #f3f4f6; 
        }
        
        .slot-btn:active, .fab-btn:active, .nav-btn:active, .cal-btn:active { transform: scale(0.92); }
        
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0f766e; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* SCROLL 2D FLUIDO Y OCULTO */
        #scroll-container {
            overflow: auto; scroll-behavior: smooth;
            -ms-overflow-style: none; scrollbar-width: none;
        }
        #scroll-container::-webkit-scrollbar { display: none; }
        
        /* Ajuste Responsive Inteligente: 7 columnas exactas */
        .day-col { 
            flex: 0 0 calc((min(100vw, 56rem) - 86px) / 7); 
            display: flex; flex-direction: column; align-items: center; border-right: 1px solid #f3f4f6; 
        }
        .day-col:last-child { border-right: none; }

        /* Estilo para los botones de coche sin globo */
        .car-image-btn {
            width: 100%; height: 100%;
            background-color: white; display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s; overflow: hidden; border-radius: 0.5rem;
        }
        .car-image-btn img {
            width: 100%; height: 100%;
            object-fit: contain; mix-blend-mode: multiply;
            transform: scale(1.35); 
        }
    </style>
</head>
<body class="font-sans flex flex-col items-center justify-center">

    <div class="w-full h-full max-w-4xl bg-white shadow-2xl relative flex flex-col overflow-hidden mx-auto">

                    <span class="text-[11px] font-black text-gray-500 uppercase tracking-widest drop-shadow-md pb-0.5">Semana</span>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7RyhObzV_0lLV4Wc_10BSCvY6Y0iAUWKAJt6gsH641xsEXvQtzPSgb3X_jfuMGXkLgw/exec';
        
        const coches = [
            { id: "BLANCO", alias: "Qashqai Blanco", img: "30492.jpg" },
            { id: "POLO", alias: "Polo", img: "30490.jpg" },
            { id: "KONA", alias: "Kona", img: "30494.jpg" },
            { id: "ATECA", alias: "Ateca", img: "30489.jpg" },
            { id: "GRIS", alias: "Qashqai Gris", img: "30498.jpg" }
        ];

        const diasNombres = ['D', 'L', 'M', 'X', 'J', 'V', 'S']; 
        
        let reservasActivas = new Map();
        let infoCochesGlobal = {}; 
        let currentCocheIdForTaller = "";
        let isEditModeInfo = false; 

        function getLocalIsoString(dateObj) {
            const pad = n => n < 10 ? '0' + n : n;
            return dateObj.getFullYear() + '-' + pad(dateObj.getMonth() + 1) + '-' + pad(dateObj.getDate());
        }

        function parseLocalDate(dateStr) {
            if(!dateStr) return new Date();
            const parts = dateStr.split('-');
            return new Date(parts[0], parts[1] - 1, parts[2]);
        }
        
        let arrayFechas = [];
        let baseDate = new Date();
        baseDate.setHours(0,0,0,0);
        baseDate.setDate(baseDate.getDate() - 15);
        for(let i=0; i<60; i++) {
            let d = new Date(baseDate);
            d.setDate(baseDate.getDate() + i);
            arrayFechas.push(d);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const selectCoche = document.getElementById('viajeCoche');
            coches.forEach(c => selectCoche.innerHTML += `<option value="${c.id}">${c.alias}</option>`);
            
            const cache = localStorage.getItem('cochesDataCache');
            if (cache) { procesarDatos(JSON.parse(cache)); cargarDatos(true); } 
            else { cargarDatos(true); }
        });

        document.addEventListener('visibilitychange', () => {
            if(document.visibilityState === 'visible') { cargarDatos(false); }
        });

        function cargarDatos(mostrarLoader = false) {
            const floatLoader = document.getElementById('floating-loader');
            const syncIcon = document.getElementById('sync-icon');
            const syncLoader = document.getElementById('sync-loader');
            
            if (mostrarLoader) {
                floatLoader.classList.remove('hidden');
                setTimeout(() => floatLoader.classList.remove('opacity-0'), 10);
                syncIcon.classList.add('hidden');
                syncLoader.classList.remove('hidden');
            }
            
            fetch(SCRIPT_URL).then(r => r.json()).then(data => {
                localStorage.setItem('cochesDataCache', JSON.stringify(data));
                procesarDatos(data);
            }).catch(e => console.log("Modo offline")).finally(() => {
                if (mostrarLoader) {
                    floatLoader.classList.add('opacity-0');
                    setTimeout(() => {
                        floatLoader.classList.add('hidden');
                        syncIcon.classList.remove('hidden');
                        syncLoader.classList.add('hidden');
                    }, 300);
                }
            });
        }

        function procesarDatos(data) {
            reservasActivas.clear();
            let arr = data.reservas ? data.reservas : data;
            arr.forEach(res => {
                reservasActivas.set(`${res.coche}_${res.fecha}_${res.turno}`, { 
                    nombre: res.nombre, taller: res.taller, observacion: res.observacion 
                });
            });
            if (data.infoCoches) infoCochesGlobal = data.infoCoches;
            renderApp();
        }

        function getImgForCoche(cocheId) {
            const found = coches.find(c => c.id === cocheId);
            return found ? found.img : "";
        }

        function getAliasForCoche(cocheId) {
            const found = coches.find(c => c.id === cocheId);
            return found ? found.alias : cocheId;
        }

        function irAHoy() {
            const todayStr = getLocalIsoString(new Date());
            const todayIndex = arrayFechas.findIndex(d => getLocalIsoString(d) === todayStr);
            if(todayIndex !== -1) {
                const diaEl = document.getElementById(`dia-${todayIndex}`);
                if (diaEl) {
                    const container = document.getElementById('scroll-container');
                    container.scrollTo({ left: diaEl.offsetLeft - 86, behavior: 'smooth' });
                }
            }
        }

        function scrollSieteDias(direccion) { 
            const container = document.getElementById('scroll-container');
            const colWidth = container.clientWidth - 86; 
            container.scrollBy({ left: direccion * colWidth, behavior: 'smooth' }); 
        }

        function renderApp() {
            const todayStr = getLocalIsoString(new Date());
            
            let fixedHtml = "";
            coches.forEach(coche => {
                fixedHtml += `
                    <div class="h-[6rem] border-b border-gray-200 last:border-b-0 w-full bg-white overflow-hidden p-0 flex-shrink-0">
                        <button onclick="mostrarDatosCoche('${coche.id}')" class="car-image-btn active:scale-95 focus:outline-none">
                            <img src="${coche.img}" alt="${coche.alias}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100\\' height=\\'100\\'><rect width=\\'100\\' height=\\'100\\' fill=\\'%23eee\\'/></svg>'">
                        </button>
                    </div>`;
            });
            document.getElementById('fixed-cars-col').innerHTML = fixedHtml;

            let gridHtml = "";
            arrayFechas.forEach((fechaObj, index) => {
                const fechaStr = getLocalIsoString(fechaObj);
                const isToday = fechaStr === todayStr;
                
                const bgClass = isToday ? 'bg-teal-50/40 border-teal-100' : 'bg-transparent border-gray-100';
                const headerBg = isToday ? 'bg-teal-50' : 'bg-white';
                const textClass = isToday ? 'text-teal-800' : 'text-gray-500';
                
                let colHtml = `
                <div class="day-col ${bgClass}" id="dia-${index}">
                    <div class="h-12 w-full flex flex-col items-center justify-center border-b border-gray-200 sticky top-0 z-30 flex-shrink-0 ${headerBg}">
                        <span class="text-[9px] ${textClass} font-bold tracking-wider">${diasNombres[fechaObj.getDay()]}</span>
                        <span class="text-[13px] font-black ${textClass}">${fechaObj.getDate()}</span>
                    </div>`;
                
                coches.forEach(coche => {
                    const idM = `${coche.id}_${fechaStr}_Mañana`;
                    const idT = `${coche.id}_${fechaStr}_Tarde`;
                    const resM = reservasActivas.get(idM);
                    const resT = reservasActivas.get(idT);
                    
                    const clickM = `abrirReservaNormal('${coche.id}', '${fechaStr}', 'Mañana', '${fechaObj.toLocaleDateString()}')`;
                    const clickT = `abrirReservaNormal('${coche.id}', '${fechaStr}', 'Tarde', '${fechaObj.toLocaleDateString()}')`;

                    const isResM = resM && resM.nombre !== "";
                    const isResT = resT && resT.nombre !== "";
                    const isTallerM = resM && resM.taller;
                    const isTallerT = resT && resT.taller;

                    let styleM = "rounded-t-full ";
                    let styleT = "rounded-b-full ";

                    if (isResM) {
                        styleM += "bg-[#901a1e] text-white shadow-inner ";
                        if (isTallerM) styleM += "border-[2.5px] border-[#f59e0b] border-b-0 "; 
                        else styleM += "border-2 border-[#2b0000] border-b-0 "; 
                    } else {
                        styleM += "bg-white ";
                        if (isTallerM) styleM += "text-[#b45309] border-[2.5px] border-[#f59e0b] border-b-0 shadow-inner "; 
                        else styleM += "text-teal-700 border-[1.5px] border-teal-500 border-b-0 ";
                    }

                    if (isResT) {
                        styleT += "bg-[#901a1e] text-white shadow-inner ";
                        if (isTallerT) styleT += "border-[2.5px] border-[#f59e0b] border-t-0 ";
                        else styleT += "border-2 border-[#2b0000] border-t-0 ";
                    } else {
                        styleT += "bg-white ";
                        if (isTallerT) styleT += "text-[#b45309] border-[2.5px] border-[#f59e0b] border-t-0 shadow-inner ";
                        else styleT += "text-teal-700 border-[1.5px] border-teal-500 border-t-0 ";
                    }

                    let midLine = `<div class="h-[1.5px] bg-teal-100 w-[90%] mx-auto"></div>`;
                    if (isTallerM && isTallerT) {
                        midLine = `<div class="h-[2.5px] bg-[#f59e0b] w-full"></div>`; 
                    } else if (isResM && isResT) {
                        midLine = `<div class="h-[2px] bg-[#2b0000] w-[95%] mx-auto"></div>`; 
                    }

                    colHtml += `
                        <div class="h-[6rem] w-full px-0.5 py-[6px] flex flex-col border-b border-gray-100 last:border-b-0 flex-shrink-0">
                            <button class="slot-btn flex-1 flex items-center justify-center font-bold text-[11px] transition-colors ${styleM}" onclick="${clickM}">M</button>
                            ${midLine}
                            <button class="slot-btn flex-1 flex items-center justify-center font-bold text-[11px] transition-colors ${styleT}" onclick="${clickT}">T</button>
                        </div>`;
                });
                
                colHtml += `</div>`;
                gridHtml += colHtml;
            });
            document.getElementById('calendar-grid').innerHTML = gridHtml;
            
            if(!window.haCentradoHoy) {
                setTimeout(() => { irAHoy(); window.haCentradoHoy = true; }, 100);
            }
        }

        // ==========================================
        // CALENDARIO INTERACTIVO (VIAJES)
        // ==========================================
        let viajeCalDate = new Date();
        let viajeStart = null;
        let viajeEnd = null;

        function abrirViajeModal() { 
            viajeStart = null;
            viajeEnd = null;
            viajeCalDate = new Date();
            viajeCalDate.setHours(0,0,0,0);
            renderViajeCal();
            document.getElementById('viajeModal').classList.remove('hidden'); 
        }

        function cambiarMesViaje(dir) {
            viajeCalDate.setMonth(viajeCalDate.getMonth() + dir);
            renderViajeCal();
        }

        function selectViajeDate(dateStr) {
            const d = parseLocalDate(dateStr);
            if (!viajeStart || (viajeStart && viajeEnd && viajeStart.getTime() !== viajeEnd.getTime())) {
                viajeStart = d; 
                viajeEnd = d;
            } else if (viajeStart && viajeEnd && viajeStart.getTime() === viajeEnd.getTime()) {
                if (d < viajeStart) { 
                    viajeStart = d; 
                    viajeEnd = d; 
                } else { 
                    viajeEnd = d; 
                }
            }
            renderViajeCal();
        }

        function renderViajeCal() {
            const y = viajeCalDate.getFullYear();
            const m = viajeCalDate.getMonth();
            const firstDay = new Date(y, m, 1).getDay();
            const daysInMonth = new Date(y, m + 1, 0).getDate();
            const startOffset = firstDay === 0 ? 6 : firstDay - 1;

            const mesNombres = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            document.getElementById('calMesAnno').innerText = `${mesNombres[m]} ${y}`;

            let html = '';
            for (let i = 0; i < startOffset; i++) { html += `<div></div>`; }

            const todayStr = getLocalIsoString(new Date());

            for (let d = 1; d <= daysInMonth; d++) {
                const currentD = new Date(y, m, d);
                const dateStr = getLocalIsoString(currentD);
                
                const startTs = viajeStart ? viajeStart.getTime() : null;
                const endTs = viajeEnd ? viajeEnd.getTime() : null;
                const ts = currentD.getTime();

                let isStart = startTs === ts;
                let isEnd = endTs === ts;
                let inRange = startTs && endTs && ts > startTs && ts < endTs;
                let isToday = todayStr === dateStr;

                let wrapperClass = "relative flex justify-center items-center h-7";
                let innerClass = "w-6 h-6 flex items-center justify-center rounded-full z-10 cursor-pointer text-gray-700 hover:bg-gray-200 transition-colors cal-btn";
                
                if (inRange) {
                    wrapperClass += " bg-teal-50";
                    innerClass = "w-full h-full rounded-none hover:bg-teal-100 text-teal-800 font-bold";
                } 
                if (isStart && isEnd) {
                    innerClass = "w-6 h-6 bg-teal-600 text-white font-bold shadow-md";
                } else if (isStart) {
                    wrapperClass += " bg-gradient-to-r from-transparent to-teal-50";
                    innerClass = "w-6 h-6 bg-teal-600 text-white font-bold shadow-md";
                } else if (isEnd) {
                    wrapperClass += " bg-gradient-to-r from-teal-50 to-transparent";
                    innerClass = "w-6 h-6 bg-teal-600 text-white font-bold shadow-md";
                } else if (!inRange && isToday && !isStart && !isEnd) {
                    innerClass += " border border-teal-400 font-bold text-teal-600";
                }

                html += `
                <div class="${wrapperClass}" onclick="selectViajeDate('${dateStr}')">
                    <div class="${innerClass}">${d}</div>
                </div>`;
            }
            document.getElementById('calGrid').innerHTML = html;

            const fmt = d => d ? `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}` : '--/--/----';
            document.getElementById('viajeFechasVisual').innerText = `${fmt(viajeStart)}  ➡️️  ${fmt(viajeEnd)}`;
        }

        function enviarViaje(e) {
            e.preventDefault();
            if (!viajeStart || !viajeEnd) { alert("Por favor, selecciona las fechas en el calendario."); return; }

            const tIn = document.getElementById('viajeTurnoIn').value;
            const tFin = document.getElementById('viajeTurnoFin').value;
            const coche = document.getElementById('viajeCoche').value; 
            const nombre = document.getElementById('viajeNombre').value;
            
            let startD = new Date(viajeStart); 
            let endD = new Date(viajeEnd);
            let payloadArr = [];
            
            for(let d = new Date(startD); d <= endD; d.setDate(d.getDate() + 1)) {
                let fStr = getLocalIsoString(d);
                if (d.getTime() === startD.getTime() && d.getTime() === endD.getTime()) {
                    if (tIn === "Tarde" && tFin === "Mañana") { } 
                    else if (tIn === "Mañana" && tFin === "Tarde") { payloadArr.push({fecha:fStr, turno:"Mañana", coche, nombre}); payloadArr.push({fecha:fStr, turno:"Tarde", coche, nombre}); }
                    else { payloadArr.push({fecha:fStr, turno:tIn, coche, nombre}); }
                } else if (d.getTime() === startD.getTime()) {
                    if (tIn === "Mañana") { payloadArr.push({fecha:fStr, turno:"Mañana", coche, nombre}); payloadArr.push({fecha:fStr, turno:"Tarde", coche, nombre}); }
                    else { payloadArr.push({fecha:fStr, turno:"Tarde", coche, nombre}); }
                } else if (d.getTime() === endD.getTime()) {
                    if (tFin === "Mañana") { payloadArr.push({fecha:fStr, turno:"Mañana", coche, nombre}); }
                    else { payloadArr.push({fecha:fStr, turno:"Mañana", coche, nombre}); payloadArr.push({fecha:fStr, turno:"Tarde", coche, nombre}); }
                } else {
                    payloadArr.push({fecha:fStr, turno:"Mañana", coche, nombre}); payloadArr.push({fecha:fStr, turno:"Tarde", coche, nombre});
                }
            }

            payloadArr.forEach(p => {
                let key = `${p.coche}_${p.fecha}_${p.turno}`;
                let actual = reservasActivas.get(key) || { taller: false, observacion: "" };
                actual.nombre = p.nombre;
                reservasActivas.set(key, actual);
            });
            renderApp();
            cerrarModal('viajeModal');
            document.getElementById('viajeNombre').value = '';

            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payloadArr) });
        }

        function formatPhone(text) {
            const phoneRegex = /\b(?:(?:\+|00)34[\s.-]?)?[6789](?:[\s.-]?\d){8}\b/g;
            return text.replace(phoneRegex, match => `<a href="tel:${match.replace(/\s+/g, '')}" class="text-blue-600 underline font-bold" onclick="event.stopPropagation()">${match}</a>`);
        }

        function guardarDatosCoche(e) {
            e.preventDefault();
            let targetKey = Object.keys(infoCochesGlobal).find(k => k.toLowerCase().includes(currentCocheIdForTaller.toLowerCase()));
            let datosNuevos = [];
            let inputs = document.querySelectorAll('input[id^="editCocheVal_"]');
            inputs.forEach(inp => { datosNuevos.push({ label: inp.getAttribute('data-label'), value: inp.value }); });
            
            infoCochesGlobal[targetKey] = datosNuevos; 
            isEditModeInfo = false;
            renderInfoCocheContent(); 

            const payload = { action: "update_coche", coche: currentCocheIdForTaller, datos: datosNuevos };
            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        }

        // CALENDARIO INTERACTIVO (TALLER)

        let tallerCalDate = new Date();
        let tallerStart = null;
        let tallerEnd = null;

        function cambiarMesTaller(dir) {
            tallerCalDate.setMonth(tallerCalDate.getMonth() + dir);
            renderTallerCal();

        function selectTallerDate(dateStr) {
            const d = parseLocalDate(dateStr);
            if (!tallerStart || (tallerStart && tallerEnd && tallerStart.getTime() !== tallerEnd.getTime())) {
                tallerStart = d; 
                tallerEnd = d;
            } else if (tallerStart && tallerEnd && tallerStart.getTime() === tallerEnd.getTime()) {

        function renderTallerCal() {
            const y = tallerCalDate.getFullYear();
            const m = tallerCalDate.getMonth();
            const firstDay = new Date(y, m, 1).getDay();
            const daysInMonth = new Date(y, m + 1, 0).getDate();
            const startOffset = firstDay === 0 ? 6 : firstDay - 1;

            const mesNombres = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            document.getElementById('calMesAnnoTaller').innerText = `${mesNombres[m]} ${y}`;

            let html = '';
            for (let i = 0; i < startOffset; i++) { html += `<div></div>`; }

            const todayStr = getLocalIsoString(new Date());

            for (let d = 1; d <= daysInMonth; d++) {
                const currentD = new Date(y, m, d);
                const dateStr = getLocalIsoString(currentD);
                
                const startTs = tallerStart ? tallerStart.getTime() : null;
                const endTs = tallerEnd ? tallerEnd.getTime() : null;
                const ts = currentD.getTime();

                let isStart = startTs === ts;
                let isEnd = endTs === ts;
                let inRange = startTs && endTs && ts > startTs && ts < endTs;
                let isToday = todayStr === dateStr;

                let wrapperClass = "relative flex justify-center items-center h-7";
                let innerClass = "w-6 h-6 flex items-center justify-center rounded-full z-10 cursor-pointer text-gray-700 hover:bg-gray-200 transition-colors cal-btn";
                
                if (inRange) {
                    wrapperClass += " bg-amber-100";
                    innerClass = "w-full h-full rounded-none hover:bg-amber-200 text-amber-900 font-bold";
                } 
                if (isStart && isEnd) {
                    innerClass = "w-6 h-6 bg-amber-600 text-white font-bold shadow-md";
                } else if (isStart) {
                    wrapperClass += " bg-gradient-to-r from-transparent to-amber-100";
                    innerClass = "w-6 h-6 bg-amber-600 text-white font-bold shadow-md";
                } else if (isEnd) {
                    wrapperClass += " bg-gradient-to-r from-amber-100 to-transparent";
                    innerClass = "w-6 h-6 bg-amber-600 text-white font-bold shadow-md";
                } else if (!inRange && isToday && !isStart && !isEnd) {
                    innerClass += " border border-amber-400 font-bold text-amber-700";
                }

                html += `
                <div class="${wrapperClass}" onclick="selectTallerDate('${dateStr}')">
                    <div class="${innerClass}">${d}</div>
                </div>`;
            }
            document.getElementById('calGridTaller').innerHTML = html;

            const fmt = d => d ? `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}` : '--/--/----';

        function abrirTallerModal() {
            cerrarModal('infoCocheModal');
            document.getElementById('tallerCocheNameText').innerText = getAliasForCoche(currentCocheIdForTaller);
            
            let slotsTaller = [];
            let checkD = new Date(); checkD.setHours(0,0,0,0);
            for(let i=0; i<60; i++) {
                let fStr = getLocalIsoString(checkD);
                let rM = reservasActivas.get(`${currentCocheIdForTaller}_${fStr}_Mañana`);
                let rT = reservasActivas.get(`${currentCocheIdForTaller}_${fStr}_Tarde`);
                if(rM && rM.taller) slotsTaller.push({ fecha: fStr, turno: 'Mañana', obs: rM.observacion });
                if(rT && rT.taller) slotsTaller.push({ fecha: fStr, turno: 'Tarde', obs: rT.observacion });
                checkD.setDate(checkD.getDate() + 1);
            }
            
            if (slotsTaller.length > 0) {
                document.getElementById('tallerMainTitleText').innerHTML = `<i class="fas fa-tools mr-2"></i>Modificar Taller:`;
                document.getElementById('tallerTurnoIn').value = slotsTaller[0].turno;
                document.getElementById('tallerTurnoFin').value = slotsTaller[slotsTaller.length-1].turno;
                document.getElementById('tallerObs').value = slotsTaller[0].obs || "";
                
                // Configurar calendario taller con el rango existente
                tallerStart = parseLocalDate(slotsTaller[0].fecha);
                tallerEnd = parseLocalDate(slotsTaller[slotsTaller.length-1].fecha);
                tallerCalDate = new Date(tallerStart);

                document.getElementById('btnBorrarTaller').classList.remove('hidden');

                document.getElementById('tallerMainTitleText').innerHTML = `<i class="fas fa-tools mr-2"></i>Nuevo Taller:`;

        function enviarTaller(e) {
            e.preventDefault();
            if (!tallerStart || !tallerEnd) { alert("Por favor, selecciona las fechas del taller en el calendario."); return; }

            const obs = document.getElementById('tallerObs').value;
            const tIn = document.getElementById('tallerTurnoIn').value;
            const tFin = document.getElementById('tallerTurnoFin').value;
            const hoyIso = getLocalIsoString(new Date());

            // Primero limpiar el taller anterior a partir de hoy
            let checkD = new Date(); checkD.setHours(0,0,0,0);
            for(let i=0; i<60; i++) {
                let fStr = getLocalIsoString(checkD);
                ['Mañana', 'Tarde'].forEach(t => {
                    let res = reservasActivas.get(`${currentCocheIdForTaller}_${fStr}_${t}`);
                    if (res) { res.taller = false; res.observacion = ""; }
                });
                checkD.setDate(checkD.getDate() + 1);
            }
            
            // Aplicar el nuevo taller
            let startD = new Date(tallerStart); 
            let endD = new Date(tallerEnd);
            
            // Para el backend necesitamos fIn y fFin en string
            const fInStr = getLocalIsoString(startD);
            const fFinStr = getLocalIsoString(endD);

            for(let d = new Date(startD); d <= endD; d.setDate(d.getDate() + 1)) {
                let fStr = getLocalIsoString(d);
                let turnos = [];
                if (d.getTime() === startD.getTime() && d.getTime() === endD.getTime()) {
                    if (tIn === "Mañana" && tFin === "Tarde") turnos = ["Mañana", "Tarde"];
                    else if (tIn === "Tarde" && tFin === "Mañana") {} 
                    else turnos = [tIn];
                } else if (d.getTime() === startD.getTime()) { turnos = (tIn === "Mañana") ? ["Mañana", "Tarde"] : ["Tarde"];
                } else if (d.getTime() === endD.getTime()) { turnos = (tFin === "Mañana") ? ["Mañana"] : ["Mañana", "Tarde"];
                } else { turnos = ["Mañana", "Tarde"]; }
                
                turnos.forEach(t => {
                    let key = `${currentCocheIdForTaller}_${fStr}_${t}`;
                    let res = reservasActivas.get(key) || { nombre: "", taller: false, observacion: "" };
                    res.taller = true; res.observacion = obs;
                    reservasActivas.set(key, res);
                });
            }
            
            renderApp();
            cerrarModal('tallerModal');

            const payload = {
                action: "taller", coche: currentCocheIdForTaller, observacion: obs, fechaHoy: hoyIso,
                inicio: { fecha: fInStr, turno: tIn }, fin: { fecha: fFinStr, turno: tFin }
            };
            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        }

        function borrarTaller() {
            const hoyIso = getLocalIsoString(new Date());
            let checkD = new Date(); checkD.setHours(0,0,0,0);
            for(let i=0; i<60; i++) {
                let fStr = getLocalIsoString(checkD);
                ['Mañana', 'Tarde'].forEach(t => {
                    let res = reservasActivas.get(`${currentCocheIdForTaller}_${fStr}_${t}`);
                    if (res) { res.taller = false; res.observacion = ""; }
                });
                checkD.setDate(checkD.getDate() + 1);
            }
            renderApp();
            cerrarModal('tallerModal');

            const payload = { action: "borrar_taller", coche: currentCocheIdForTaller, fechaHoy: hoyIso };
            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        }

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(err => console.error(err));
    </script>
</body>
