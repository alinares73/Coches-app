<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coches Ciudadela</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f766e"> 
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { -webkit-user-select: none; user-select: none; touch-action: manipulation; overflow: hidden; background-color: #f9fafb; }
        .bg-teal-header { background-color: #0f766e; }
        
        .slot-btn:active, .car-btn:active { transform: scale(0.92); }
        
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0f766e; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* SCROLL FLUIDO TIPO EXCEL */
        #scroll-container {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        #scroll-container::-webkit-scrollbar { display: none; }
        
        /* Ajuste fino de columnas para que quede compacto */
        .day-col { width: 42px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
    </style>
</head>
<body class="min-h-screen font-sans flex flex-col items-center">

    <div class="w-full max-w-md bg-white h-screen shadow-2xl relative flex flex-col">
        
        <header class="bg-teal-header text-white pt-6 pb-4 px-4 shadow-md z-30 relative shrink-0">
            <div class="flex items-center justify-between">
                <button onclick="abrirViajeModal()" class="flex items-center justify-center bg-white bg-opacity-20 hover:bg-opacity-30 rounded-lg px-3 py-1.5 text-sm font-bold transition">
                    <i class="fas fa-plus mr-2"></i> Añadir Viaje
                </button>
                <div class="flex items-center gap-2">
                    <h1 class="text-xl font-bold tracking-wider">COCHES</h1>
                </div>
                <button onclick="cargarDatos()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white hover:bg-opacity-20 transition">
                    <i class="fas fa-sync-alt text-white opacity-90"></i>
                </button>
            </div>
        </header>

        <div id="loading-screen" class="absolute inset-0 z-40 bg-white bg-opacity-95 flex flex-col items-center justify-center mt-20">
            <div class="loader mb-4"></div>
            <p class="text-teal-800 font-semibold animate-pulse tracking-wide">Sincronizando...</p>
        </div>

        <main class="flex-1 flex w-full relative bg-white overflow-hidden">
            
            <!-- COLUMNA FIJA (Coches + Flecha Izquierda) -->
            <div class="w-[50px] flex-shrink-0 flex flex-col bg-gray-50 border-r border-gray-200 z-20 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">
                <div class="h-[52px] w-full flex items-center justify-center border-b border-gray-200 bg-gray-100">
                    <button onclick="scrollSieteDias(-1)" class="w-8 h-8 flex items-center justify-center text-teal-700 hover:bg-gray-200 rounded-full transition">
                        <i class="fas fa-chevron-left text-sm"></i>
                    </button>
                </div>
                <div id="fixed-cars-col" class="flex flex-col"></div>
            </div>

            <!-- ZONA DE SCROLL HORIZONTAL NATIVO -->
            <div id="scroll-container" class="flex-1 relative bg-white pb-20">
                <div id="calendar-grid" class="flex gap-x-[2px] px-1">
                    <!-- Columnas inyectadas por JS -->
                </div>
            </div>

            <!-- Flecha Derecha Flotante -->
            <div class="absolute right-0 top-0 h-[52px] w-8 bg-gradient-to-l from-white via-white to-transparent flex items-center justify-end pr-1 z-20 pointer-events-none">
                <button onclick="scrollSieteDias(1)" class="w-6 h-8 text-teal-700 flex items-center justify-center pointer-events-auto hover:text-teal-900 transition">
                    <i class="fas fa-chevron-right text-sm"></i>
                </button>
            </div>
        </main>
    </div>

    <!-- MODALES VARIOS... (Se mantienen similares pero se añade Viaje y Taller) -->
    
    <!-- MODAL RESERVA SIMPLE -->
    <div id="reservaModal" class="hidden fixed inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b pb-2 border-gray-100">
                <h2 id="modalTitle" class="text-xl font-bold text-teal-800">Reserva</h2>
                <button onclick="cerrarModal('reservaModal')" class="text-gray-400 text-2xl">&times;</button>
            </div>
            <div class="mb-5 text-gray-700 bg-gray-50 p-3 rounded-lg text-sm">
                <p><i class="fas fa-car text-teal-600 mr-2"></i> <strong id="modalCoche"></strong></p>
                <p class="mt-1"><i class="far fa-calendar-alt text-teal-600 mr-2"></i> <span id="modalFecha"></span> (<span id="modalTurno" class="font-semibold"></span>)</p>
            </div>
            <form id="formReserva" onsubmit="enviarReservaNormal(event)">
                <input type="text" id="inputNombre" placeholder="Tu Nombre o Horario..." class="w-full mb-2 border-2 border-gray-200 rounded-xl p-3 text-lg focus:border-teal-600 focus:outline-none">
                <p class="text-[11px] text-gray-500 mb-4">Déjalo en blanco para eliminar la reserva.</p>
                <button type="submit" id="btnConfirmarReserva" class="w-full bg-teal-700 text-white font-bold py-3 rounded-xl mb-2">Guardar</button>
            </form>
        </div>
    </div>

    <!-- MODAL DATOS COCHE -->
    <div id="infoCocheModal" class="hidden fixed inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl max-h-[90vh] flex flex-col">
            <h3 class="text-lg font-bold text-gray-800 text-center mb-4" id="infoCocheTitle">Datos Vehículo</h3>
            <div id="infoCocheContent" class="text-gray-600 text-sm bg-gray-50 p-3 rounded-xl border border-gray-100 flex-1 overflow-y-auto mb-4"></div>
            
            <button onclick="abrirTallerModal()" class="w-full bg-red-50 border border-red-200 text-red-700 hover:bg-red-100 font-bold py-3 rounded-xl transition flex items-center justify-center mb-2">
                <i class="fas fa-wrench mr-2"></i> Observación Taller
            </button>
            <button onclick="cerrarModal('infoCocheModal')" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 rounded-xl transition">Cerrar</button>
        </div>
    </div>

    <!-- MODAL VIAJE (Multi-día) -->
    <div id="viajeModal" class="hidden fixed inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-3 border-b pb-2 border-gray-100">
                <h2 class="text-xl font-bold text-teal-800">Añadir Viaje</h2>
                <button onclick="cerrarModal('viajeModal')" class="text-gray-400 text-2xl">&times;</button>
            </div>
            <form onsubmit="enviarViaje(event)">
                <div class="mb-3">
                    <label class="text-xs font-bold text-gray-500 uppercase">Coche</label>
                    <select id="viajeCoche" class="w-full border border-gray-300 p-2 rounded-lg bg-white mt-1"></select>
                </div>
                <div class="mb-3">
                    <label class="text-xs font-bold text-gray-500 uppercase">Nombre del Viaje / Conductor</label>
                    <input type="text" id="viajeNombre" required class="w-full border border-gray-300 p-2 rounded-lg mt-1">
                </div>
                <div class="flex gap-2 mb-3">
                    <div class="w-1/2">
                        <label class="text-xs font-bold text-gray-500 uppercase">Inicio</label>
                        <input type="date" id="viajeFechaIn" required class="w-full border border-gray-300 p-2 rounded-lg mt-1 text-sm">
                        <select id="viajeTurnoIn" class="w-full border border-gray-300 p-2 rounded-lg mt-1 text-sm"><option>Mañana</option><option>Tarde</option></select>
                    </div>
                    <div class="w-1/2">
                        <label class="text-xs font-bold text-gray-500 uppercase">Fin</label>
                        <input type="date" id="viajeFechaFin" required class="w-full border border-gray-300 p-2 rounded-lg mt-1 text-sm">
                        <select id="viajeTurnoFin" class="w-full border border-gray-300 p-2 rounded-lg mt-1 text-sm"><option>Mañana</option><option>Tarde</option></select>
                    </div>
                </div>
                <button type="submit" id="btnViaje" class="w-full bg-teal-700 text-white font-bold py-3 rounded-xl mt-2">Guardar Viaje</button>
            </form>
        </div>
    </div>

    <!-- MODAL TALLER -->
    <div id="tallerModal" class="hidden fixed inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl border-2 border-red-500">
            <div class="flex justify-between items-center mb-3 border-b pb-2 border-red-100">
                <h2 class="text-xl font-bold text-red-700"><i class="fas fa-wrench mr-2"></i>Taller: <span id="tallerCocheName"></span></h2>
                <button onclick="cerrarModal('tallerModal')" class="text-gray-400 text-2xl">&times;</button>
            </div>
            <form onsubmit="enviarTaller(event)">
                <div class="mb-3">
                    <label class="text-xs font-bold text-gray-500 uppercase">Observación</label>
                    <textarea id="tallerObs" required class="w-full border border-gray-300 p-2 rounded-lg mt-1" rows="2" placeholder="Ej: Cambio de aceite..."></textarea>
                </div>
                <div class="flex gap-2 mb-4">
                    <div class="w-1/2">
                        <label class="text-xs font-bold text-gray-500 uppercase">Inicio Espera</label>
                        <input type="date" id="tallerFechaIn" required class="w-full border border-gray-300 p-2 rounded-lg mt-1 text-sm">
                        <select id="tallerTurnoIn" class="w-full border border-gray-300 p-2 rounded-lg mt-1 text-sm"><option>Mañana</option><option>Tarde</option></select>
                    </div>
                    <div class="w-1/2">
                        <label class="text-xs font-bold text-gray-500 uppercase">Fin Espera</label>
                        <input type="date" id="tallerFechaFin" required class="w-full border border-gray-300 p-2 rounded-lg mt-1 text-sm">
                        <select id="tallerTurnoFin" class="w-full border border-gray-300 p-2 rounded-lg mt-1 text-sm"><option>Mañana</option><option>Tarde</option></select>
                    </div>
                </div>
                <button type="submit" id="btnTaller" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl mt-2">Mandar al Taller</button>
            </form>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7RyhObzV_0lLV4Wc_10BSCvY6Y0iAUWKAJt6gsH641xsEXvQtzPSgb3X_jfuMGXkLgw/exec';
        
        const coches = [
            { id: "BLANCO", alias: "Qashqai<br>Blanco" },
            { id: "POLO", alias: "Polo" },
            { id: "KONA", alias: "Kona" },
            { id: "ATECA", alias: "Ateca" },
            { id: "GRIS", alias: "Qashqai<br>Gris" }
        ];

        const diasNombres = ['D', 'L', 'M', 'X', 'J', 'V', 'S']; 
        
        let reservasActivas = new Map();
        let infoCochesGlobal = {}; 
        let currentCocheIdForTaller = "";
        
        // Generamos un rango de 60 días para el scroll nativo (-15 pasado a +45 futuro)
        let arrayFechas = [];
        let baseDate = new Date();
        baseDate.setHours(0,0,0,0);
        baseDate.setDate(baseDate.getDate() - 15);
        for(let i=0; i<60; i++) {
            let d = new Date(baseDate);
            d.setDate(baseDate.getDate() + i);
            arrayFechas.push(d);
        }

        // Llenar selectores modales
        window.addEventListener('DOMContentLoaded', () => {
            const selectCoche = document.getElementById('viajeCoche');
            coches.forEach(c => selectCoche.innerHTML += `<option value="${c.id}">${c.alias.replace('<br>',' ')}</option>`);
            
            // Poner fecha de hoy por defecto en los modales
            const hoyIso = new Date().toISOString().split('T')[0];
            document.getElementById('viajeFechaIn').value = hoyIso;
            document.getElementById('viajeFechaFin').value = hoyIso;
            document.getElementById('tallerFechaIn').value = hoyIso;
            document.getElementById('tallerFechaFin').value = hoyIso;
        });

        function cargarDatos() {
            document.getElementById('loading-screen').classList.remove('hidden');
            fetch(SCRIPT_URL)
                .then(r => r.json())
                .then(data => {
                    reservasActivas.clear();
                    let arr = data.reservas ? data.reservas : data;
                    arr.forEach(res => {
                        let clave = `${res.coche}_${res.fecha}_${res.turno}`;
                        reservasActivas.set(clave, { nombre: res.nombre, taller: res.taller });
                    });
                    if (data.infoCoches) infoCochesGlobal = data.infoCoches;
                    renderApp(); 
                })
                .catch(e => { alert("Modo sin conexión."); renderApp(); })
                .finally(() => document.getElementById('loading-screen').classList.add('hidden'));
        }

        function renderApp() {
            const todayStr = new Date().toDateString();
            
            // Render Columna Fija
            let fixedHtml = "";
            coches.forEach(coche => {
                fixedHtml += `
                    <div class="flex items-center justify-center py-[5px] h-[4.7rem]">
                        <button onclick="mostrarDatosCoche('${coche.id}', '${coche.alias}')" class="w-[42px] h-[4.2rem] rounded-xl border border-gray-200 bg-white shadow-sm flex flex-col items-center justify-center text-[8px] font-bold text-gray-600 text-center leading-tight gap-[2px] transition active:bg-gray-100">
                            <span>${coche.alias}</span>
                            <i class="far fa-file-alt text-teal-600 text-[11px]"></i>
                        </button>
                    </div>`;
            });
            document.getElementById('fixed-cars-col').innerHTML = fixedHtml;

            // Render Scroll (Días y Reservas)
            let gridHtml = "";
            arrayFechas.forEach((fechaObj, index) => {
                const isToday = fechaObj.toDateString() === todayStr;
                const fechaStr = new Date(fechaObj.getTime() - (fechaObj.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                
                const bgClass = isToday ? 'bg-teal-50 border-x border-teal-200 shadow-sm z-10' : 'bg-transparent';
                const textClass = isToday ? 'text-teal-800' : 'text-gray-500';
                
                let colHtml = `
                <div class="day-col ${bgClass}" id="dia-${index}">
                    <div class="h-[52px] w-full flex flex-col items-center justify-center border-b border-gray-100">
                        <span class="text-[9px] ${textClass} font-bold tracking-wider">${diasNombres[fechaObj.getDay()]}</span>
                        <span class="text-[13px] font-bold ${textClass}">${fechaObj.getDate()}</span>
                    </div>`;
                
                coches.forEach(coche => {
                    const idM = `${coche.id}_${fechaStr}_Mañana`;
                    const idT = `${coche.id}_${fechaStr}_Tarde`;
                    
                    const resM = reservasActivas.get(idM);
                    const resT = reservasActivas.get(idT);
                    
                    const clickM = `abrirReservaNormal('${coche.id}', '${coche.alias.replace('<br>',' ')}', '${fechaStr}', 'Mañana', '${fechaObj.toLocaleDateString()}')`;
                    const clickT = `abrirReservaNormal('${coche.id}', '${coche.alias.replace('<br>',' ')}', '${fechaStr}', 'Tarde', '${fechaObj.toLocaleDateString()}')`;

                    // Lógica de estilos
                    let styleM = "bg-white text-teal-700 border border-teal-500 border-b-0 rounded-t-full";
                    let styleT = "bg-white text-teal-700 border border-teal-500 border-t-0 rounded-b-full";
                    let midLine = `<div class="h-[1px] bg-teal-100 mx-1"></div>`;
                    
                    if (resM && resM.nombre !== "") { styleM = "bg-[#c2410c] text-white border border-[#c2410c] border-b-white/30 rounded-t-full"; }
                    if (resT && resT.nombre !== "") { styleT = "bg-[#c2410c] text-white border border-[#c2410c] border-t-white/30 rounded-b-full"; }
                    if (resM && resM.nombre !== "" && resT && resT.nombre !== "") { midLine = `<div class="h-[1px] bg-transparent"></div>`; }
                    
                    // Sobreescritura si es TALLER (Borde rojo doble)
                    if (resM && resM.taller) { styleM = "bg-white text-red-700 border-[2.5px] border-red-600 border-b-0 rounded-t-full shadow-inner"; }
                    if (resT && resT.taller) { styleT = "bg-white text-red-700 border-[2.5px] border-red-600 border-t-0 rounded-b-full shadow-inner"; }

                    colHtml += `
                        <div class="h-[4.7rem] w-full max-w-[34px] flex flex-col py-[5px]">
                            <button class="slot-btn flex-1 flex items-center justify-center font-bold text-[10px] transition-colors ${styleM}" onclick="${clickM}">M</button>
                            ${midLine}
                            <button class="slot-btn flex-1 flex items-center justify-center font-bold text-[10px] transition-colors ${styleT}" onclick="${clickT}">T</button>
                        </div>`;
                });
                
                colHtml += `</div>`;
                gridHtml += colHtml;
            });
            document.getElementById('calendar-grid').innerHTML = gridHtml;
            
            // Centrar el scroll en "HOY" suavemente
            setTimeout(() => {
                const todayIndex = arrayFechas.findIndex(d => d.toDateString() === todayStr);
                if(todayIndex !== -1) {
                    const scrollC = document.getElementById('scroll-container');
                    const diaEl = document.getElementById(`dia-${todayIndex}`);
                    scrollC.scrollTo({ left: diaEl.offsetLeft - 45, behavior: 'smooth' });
                }
            }, 100);
        }

        // Navegación rápida por flechas (Salto de 7 días nativo)
        function scrollSieteDias(direccion) {
            const container = document.getElementById('scroll-container');
            container.scrollBy({ left: direccion * 42 * 7, behavior: 'smooth' });
        }

        function cerrarModal(id) { document.getElementById(id).classList.add('hidden'); }

        // --- FUNCIONES MODAL RESERVA SIMPLE ---
        let reservaPendiente = null;
        function abrirReservaNormal(cocheId, cocheAlias, fechaISO, turno, fechaTexto) {
            reservaPendiente = { coche: cocheId, fecha: fechaISO, turno, id: `${cocheId}_${fechaISO}_${turno}` };
            document.getElementById('modalCoche').innerHTML = cocheAlias;
            document.getElementById('modalFecha').innerText = fechaTexto;
            document.getElementById('modalTurno').innerText = turno;
            
            let resObj = reservasActivas.get(reservaPendiente.id);
            const input = document.getElementById('inputNombre');
            
            if (resObj && resObj.nombre !== "") {
                document.getElementById('modalTitle').innerText = "Editar Reserva";
                document.getElementById('modalTitle').className = "text-xl font-bold text-[#c2410c]";
                input.value = resObj.nombre;
            } else {
                document.getElementById('modalTitle').innerText = "Nueva Reserva";
                document.getElementById('modalTitle').className = "text-xl font-bold text-teal-800";
                input.value = localStorage.getItem('ultimoNombreCoches') || '';
            }
            document.getElementById('reservaModal').classList.remove('hidden');
        }

        function enviarReservaNormal(e) {
            e.preventDefault();
            const nombre = document.getElementById('inputNombre').value.trim();
            if (nombre !== '') localStorage.setItem('ultimoNombreCoches', nombre); 
            
            const btn = document.getElementById('btnConfirmarReserva');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;

            fetch(SCRIPT_URL, { 
                method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify([{ fecha: reservaPendiente.fecha, nombre: nombre, coche: reservaPendiente.coche, turno: reservaPendiente.turno }]) 
            })
            .then(() => {
                let actual = reservasActivas.get(reservaPendiente.id) || { taller: false };
                actual.nombre = nombre;
                reservasActivas.set(reservaPendiente.id, actual);
                renderApp();
                cerrarModal('reservaModal');
            })
            .catch(e => alert("Error al guardar."))
            .finally(() => { btn.innerHTML = 'Guardar'; btn.disabled = false; });
        }

        // --- FUNCIONES MODAL DATOS COCHE ---
        function mostrarDatosCoche(cocheId, cocheAlias) {
            currentCocheIdForTaller = cocheId; 
            document.getElementById('infoCocheTitle').innerHTML = cocheAlias.replace('<br>', ' ');
            
            let htmlContent = "";
            let targetKey = Object.keys(infoCochesGlobal).find(k => k.toLowerCase().includes(cocheId.toLowerCase()));
            
            if (targetKey && infoCochesGlobal[targetKey] && infoCochesGlobal[targetKey].length > 0) {
                let lista = infoCochesGlobal[targetKey].map(item => `
                    <div class="flex justify-between border-b border-gray-200 border-opacity-60 py-2 last:border-0 items-center">
                        <span class="text-[11px] font-bold text-teal-700 uppercase tracking-wide w-5/12 pr-1">${item.label}</span>
                        <span class="text-[12px] font-medium text-gray-700 w-7/12 text-right break-words">${item.value || '-'}</span>
                    </div>
                `).join('');
                htmlContent = `<div class="flex flex-col">${lista}</div>`;
            } else {
                htmlContent = `<p class="text-center text-gray-500 my-4">Sin datos en Drive.</p>`;
            }
            
            document.getElementById('infoCocheContent').innerHTML = htmlContent;
            document.getElementById('infoCocheModal').classList.remove('hidden');
        }

        // --- FUNCIONES TALLER ---
        function abrirTallerModal() {
            cerrarModal('infoCocheModal');
            document.getElementById('tallerCocheName').innerText = currentCocheIdForTaller;
            document.getElementById('tallerModal').classList.remove('hidden');
        }

        function enviarTaller(e) {
            e.preventDefault();
            const payload = {
                action: "taller",
                coche: currentCocheIdForTaller,
                observacion: document.getElementById('tallerObs').value,
                inicio: { fecha: document.getElementById('tallerFechaIn').value, turno: document.getElementById('tallerTurnoIn').value },
                fin: { fecha: document.getElementById('tallerFechaFin').value, turno: document.getElementById('tallerTurnoFin').value }
            };

            const btn = document.getElementById('btnTaller');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; btn.disabled = true;

            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
            .then(() => { alert("Taller registrado. Pulsa Sincronizar para ver los cambios."); cerrarModal('tallerModal'); })
            .catch(e => alert("Error de red."))
            .finally(() => { btn.innerHTML = 'Mandar al Taller'; btn.disabled = false; });
        }

        // --- FUNCIONES VIAJE ---
        function abrirViajeModal() { document.getElementById('viajeModal').classList.remove('hidden'); }

        function enviarViaje(e) {
            e.preventDefault();
            const btn = document.getElementById('btnViaje');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; btn.disabled = true;

            const fIn = document.getElementById('viajeFechaIn').value; const tIn = document.getElementById('viajeTurnoIn').value;
            const fFin = document.getElementById('viajeFechaFin').value; const tFin = document.getElementById('viajeTurnoFin').value;
            const coche = document.getElementById('viajeCoche').value; const nombre = document.getElementById('viajeNombre').value;
            
            // Generar todos los slots
            let startD = new Date(fIn); let endD = new Date(fFin);
            let payloadArr = [];
            
            for(let d = new Date(startD); d <= endD; d.setDate(d.getDate() + 1)) {
                let fStr = d.toISOString().split('T')[0];
                if (d.getTime() === startD.getTime() && d.getTime() === endD.getTime()) {
                    if (tIn === "Tarde" && tFin === "Mañana") { /* Rango inválido */ } 
                    else if (tIn === "Mañana" && tFin === "Tarde") { payloadArr.push({fecha:fStr, turno:"Mañana", coche, nombre}); payloadArr.push({fecha:fStr, turno:"Tarde", coche, nombre}); }
                    else { payloadArr.push({fecha:fStr, turno:tIn, coche, nombre}); }
                } else if (d.getTime() === startD.getTime()) {
                    if (tIn === "Mañana") { payloadArr.push({fecha:fStr, turno:"Mañana", coche, nombre}); payloadArr.push({fecha:fStr, turno:"Tarde", coche, nombre}); }
                    else { payloadArr.push({fecha:fStr, turno:"Tarde", coche, nombre}); }
                } else if (d.getTime() === endD.getTime()) {
                    if (tFin === "Mañana") { payloadArr.push({fecha:fStr, turno:"Mañana", coche, nombre}); }
                    else { payloadArr.push({fecha:fStr, turno:"Mañana", coche, nombre}); payloadArr.push({fecha:fStr, turno:"Tarde", coche, nombre}); }
                } else {
                    payloadArr.push({fecha:fStr, turno:"Mañana", coche, nombre}); payloadArr.push({fecha:fStr, turno:"Tarde", coche, nombre});
                }
            }

            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payloadArr) })
            .then(() => { alert("Viaje añadido. Pulsa Sincronizar para visualizar."); cerrarModal('viajeModal'); document.getElementById('viajeNombre').value = ''; })
            .catch(e => alert("Error al guardar."))
            .finally(() => { btn.innerHTML = 'Guardar Viaje'; btn.disabled = false; });
        }

        window.onload = cargarDatos;
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(err => console.error(err));
    </script>
</body>
</html>
