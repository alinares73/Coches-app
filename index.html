<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coches Ciudadela</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#115e59"> 
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { -webkit-user-select: none; user-select: none; touch-action: manipulation; overflow-x: hidden; }
        .bg-teal-header { background-color: #0f766e; }
        
        .slot-btn:active, .car-btn:active { transform: scale(0.92); }
        
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0f766e; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #swipe-container {
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.2s ease;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans flex flex-col items-center">

    <div class="w-full max-w-md bg-white min-h-screen shadow-2xl relative pb-20 overflow-hidden">
        
        <header class="bg-teal-header text-white pt-6 pb-4 px-4 rounded-b-2xl shadow-lg z-20 relative">
            <div class="flex items-center justify-between">
                <div class="w-8"></div>
                <div class="flex items-center gap-2">
                    <i class="fas fa-car-side text-2xl opacity-90"></i>
                    <h1 class="text-xl font-semibold tracking-wider">COCHES</h1>
                </div>
                <button onclick="cargarDatos()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white hover:bg-opacity-20 transition">
                    <i class="fas fa-sync-alt text-white opacity-90"></i>
                </button>
            </div>
        </header>

        <div id="loading-screen" class="absolute inset-0 z-40 bg-white bg-opacity-95 flex flex-col items-center justify-center mt-24">
            <div class="loader mb-4"></div>
            <p class="text-teal-800 font-semibold animate-pulse tracking-wide">Sincronizando...</p>
        </div>

        <main id="swipe-area" class="p-2 mt-4 relative">
            <div id="swipe-container" class="w-full">
                <div id="calendar-grid" class="grid grid-cols-[55px_repeat(7,1fr)] gap-x-1 gap-y-3 px-1 items-start">
                    <!-- Se inyecta con Javascript -->
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL DE RESERVA -->
    <div id="reservaModal" class="hidden fixed inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b pb-2 border-gray-100">
                <h2 id="modalTitle" class="text-xl font-bold text-teal-800">Nueva Reserva</h2>
                <button id="closeModalBtn" class="text-gray-400 text-2xl hover:text-gray-600 transition">&times;</button>
            </div>
            <div class="mb-5 text-gray-700 bg-gray-50 p-3 rounded-lg text-sm">
                <p><i class="fas fa-car text-teal-600 mr-2 w-4"></i> <strong id="modalCoche"></strong></p>
                <p class="mt-1"><i class="far fa-calendar-alt text-teal-600 mr-2 w-4"></i> <span id="modalFecha"></span> (<span id="modalTurno" class="font-semibold"></span>)</p>
            </div>
            <form id="formReserva">
                <div class="mb-5">
                    <input type="text" id="inputNombre" placeholder="Tu Nombre o Horario..." class="w-full border-2 border-gray-200 rounded-xl p-3 text-lg focus:border-teal-600 focus:ring-2 focus:ring-teal-100 focus:outline-none transition">
                    <p class="text-xs text-gray-400 mt-2 ml-1" id="hintBorrar">Déjalo en blanco para eliminar la reserva.</p>
                </div>
                <div class="flex flex-col gap-2">
                    <button type="submit" id="btnConfirmar" class="w-full bg-teal-700 text-white font-bold py-3 rounded-xl flex items-center justify-center text-lg shadow-md transition hover:bg-teal-800">
                        Guardar
                    </button>
                    <button type="button" id="btnBorrar" class="hidden w-full bg-red-50 text-red-600 font-bold py-3 rounded-xl flex items-center justify-center text-lg transition border border-red-100 hover:bg-red-100">
                        <i class="fas fa-trash-alt mr-2"></i> Eliminar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL DATOS TÉCNICOS COCHE -->
    <div id="infoCocheModal" class="hidden fixed inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-xs p-6 shadow-2xl">
            <div class="flex items-center justify-center mb-4">
                <div class="w-14 h-14 bg-teal-50 rounded-full flex items-center justify-center text-teal-700 text-2xl border border-teal-100">
                    <i class="fas fa-clipboard-list"></i>
                </div>
            </div>
            <h3 class="text-xl font-bold text-gray-800 text-center mb-4" id="infoCocheTitle">Datos del Vehículo</h3>
            <div id="infoCocheContent" class="text-gray-600 text-sm bg-gray-50 p-4 rounded-xl border border-gray-100 min-h-[80px]">
                <!-- Datos insertados por JS -->
            </div>
            <button onclick="cerrarInfoCoche()" class="mt-5 w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 rounded-xl transition">Cerrar</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7RyhObzV_0lLV4Wc_10BSCvY6Y0iAUWKAJt6gsH641xsEXvQtzPSgb3X_jfuMGXkLgw/exec';
        
        // Exclusivamente los 5 coches correctos
        const coches = [
            { id: "BLANCO", alias: "Qashqai<br>Blanco" },
            { id: "POLO", alias: "Polo" },
            { id: "KONA", alias: "Kona" },
            { id: "ATECA", alias: "Ateca" },
            { id: "GRIS", alias: "Qashqai<br>Gris" }
        ];

        const diasNombres = ['D', 'L', 'M', 'X', 'J', 'V', 'S']; 
        
        let startDate = new Date();
        startDate.setHours(0,0,0,0);
        
        let reservasActivas = new Map();
        let infoCochesGlobal = {}; 

        function cargarDatos() {
            document.getElementById('loading-screen').classList.remove('hidden');
            fetch(SCRIPT_URL)
                .then(response => response.json())
                .then(data => {
                    reservasActivas.clear();
                    let arrayReservas = data.reservas ? data.reservas : data;
                    arrayReservas.forEach(res => reservasActivas.set(`${res.coche}_${res.fecha}_${res.turno}`, res.nombre));
                    
                    if (data.infoCoches) infoCochesGlobal = data.infoCoches;
                    
                    renderApp(); 
                })
                .catch(error => { alert("Error de red. Mostrando datos locales."); renderApp(); })
                .finally(() => document.getElementById('loading-screen').classList.add('hidden'));
        }

        function renderApp() {
            const gridContainer = document.getElementById('calendar-grid');
            gridContainer.innerHTML = '';
            const todayStr = new Date().toDateString();
            
            let htmlContent = `
                <div class="flex items-center justify-center relative h-10 w-full">
                    <button onclick="animarCambioSemana(-1)" class="absolute right-0 w-8 h-10 flex items-center justify-center text-teal-700 hover:text-teal-900 transition">
                        <i class="fas fa-chevron-left text-lg"></i>
                    </button>
                </div>
            `; 
            
            const fechasSemana = [];
            for (let i = 0; i < 7; i++) {
                const dia = new Date(startDate);
                dia.setDate(startDate.getDate() + i);
                fechasSemana.push(dia);
                
                const isToday = dia.toDateString() === todayStr;
                const bgClass = isToday ? 'bg-teal-50 border border-teal-200' : 'bg-transparent';
                const textClass = isToday ? 'text-teal-800' : 'text-gray-500';
                
                let flechaDerecha = (i === 6) ? `
                    <button onclick="animarCambioSemana(1)" class="absolute -right-7 top-0 w-8 h-10 flex items-center justify-center text-teal-700 hover:text-teal-900 transition">
                        <i class="fas fa-chevron-right text-lg"></i>
                    </button>
                ` : '';

                htmlContent += `
                    <div class="relative flex flex-col items-center justify-center rounded-lg py-1 ${bgClass}">
                        <span class="text-[10px] ${textClass} font-bold tracking-wider">${diasNombres[dia.getDay()]}</span>
                        <span class="text-sm font-bold ${textClass}">${dia.getDate()}</span>
                        ${flechaDerecha}
                    </div>
                `;
            }
            gridContainer.innerHTML += htmlContent;

            coches.forEach(coche => {
                let rowHtml = `
                    <div class="flex items-center justify-center py-1">
                        <button onclick="mostrarDatosCoche('${coche.id}', '${coche.alias}')" class="car-btn w-12 h-[4.2rem] rounded-xl border border-gray-200 bg-gray-50 shadow-sm flex flex-col items-center justify-center text-[9px] font-bold text-gray-600 text-center leading-tight gap-1 transition active:bg-gray-100">
                            <span>${coche.alias}</span>
                            <i class="far fa-file-alt text-teal-600 text-xs mt-0.5"></i>
                        </button>
                    </div>
                `;
                
                fechasSemana.forEach(fechaObj => {
                    const fechaStr = new Date(fechaObj.getTime() - (fechaObj.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                    const idM = `${coche.id}_${fechaStr}_Mañana`;
                    const idT = `${coche.id}_${fechaStr}_Tarde`;
                    
                    const ocupadoM = reservasActivas.has(idM);
                    const ocupadoT = reservasActivas.has(idT);
                    
                    const clickM = `abrirModal('${coche.id}', '${coche.alias.replace('<br>',' ')}', '${fechaStr}', 'Mañana', '${fechaObj.toLocaleDateString()}')`;
                    const clickT = `abrirModal('${coche.id}', '${coche.alias.replace('<br>',' ')}', '${fechaStr}', 'Tarde', '${fechaObj.toLocaleDateString()}')`;

                    const styleFreeM = "bg-white text-teal-700 border-2 border-teal-600 border-b-[1px] rounded-t-full";
                    const styleFreeT = "bg-white text-teal-700 border-2 border-teal-600 border-t-[1px] rounded-b-full";
                    const styleOcuM  = "bg-[#c2410c] text-white border-2 border-[#c2410c] border-b-white/40 rounded-t-full shadow-inner";
                    const styleOcuT  = "bg-[#c2410c] text-white border-2 border-[#c2410c] border-t-white/40 rounded-b-full shadow-inner";

                    rowHtml += `
                        <div class="flex flex-col h-[4.2rem] w-full max-w-[38px] mx-auto py-1">
                            <button class="slot-btn flex-1 flex items-center justify-center font-bold text-xs transition-colors ${ocupadoM ? styleOcuM : styleFreeM}" onclick="${clickM}">M</button>
                            <button class="slot-btn flex-1 flex items-center justify-center font-bold text-xs transition-colors ${ocupadoT ? styleOcuT : styleFreeT}" onclick="${clickT}">T</button>
                        </div>
                    `;
                });
                gridContainer.innerHTML += rowHtml;
            });
        }

        function animarCambioSemana(direccion) {
            const container = document.getElementById('swipe-container');
            container.style.transform = `translateX(${direccion * -30}px)`;
            container.style.opacity = '0';
            
            setTimeout(() => {
                startDate.setDate(startDate.getDate() + (7 * direccion));
                renderApp();
                container.style.transition = 'none';
                container.style.transform = `translateX(${direccion * 30}px)`;
                
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        container.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.2s ease';
                        container.style.transform = 'translateX(0)';
                        container.style.opacity = '1';
                    });
                });
            }, 200);
        }

        let touchStartX = 0;
        const swipeArea = document.getElementById('swipe-area');
        swipeArea.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
        swipeArea.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchEndX < touchStartX - 50) animarCambioSemana(1); 
            if (touchEndX > touchStartX + 50) animarCambioSemana(-1); 
        }, {passive: true});

        let reservaPendiente = null;
        
        function abrirModal(cocheId, cocheAlias, fechaISO, turno, fechaTexto) {
            reservaPendiente = { coche: cocheId, fecha: fechaISO, turno, id: `${cocheId}_${fechaISO}_${turno}` };
            
            document.getElementById('modalCoche').innerHTML = cocheAlias;
            document.getElementById('modalFecha').innerText = fechaTexto;
            document.getElementById('modalTurno').innerText = turno;
            
            const inputElement = document.getElementById('inputNombre');
            const btnBorrar = document.getElementById('btnBorrar');
            const hint = document.getElementById('hintBorrar');
            const title = document.getElementById('modalTitle');
            
            if (reservasActivas.has(reservaPendiente.id)) {
                title.innerText = "Editar Reserva";
                title.className = "text-xl font-bold text-[#c2410c]"; 
                inputElement.value = reservasActivas.get(reservaPendiente.id);
                btnBorrar.classList.remove('hidden'); 
                hint.classList.remove('hidden');
            } else {
                title.innerText = "Nueva Reserva";
                title.className = "text-xl font-bold text-teal-800";
                const ultimoNombre = localStorage.getItem('ultimoNombreCoches');
                inputElement.value = ultimoNombre ? ultimoNombre : '';
                btnBorrar.classList.add('hidden'); 
                hint.classList.add('hidden');
            }
            
            document.getElementById('reservaModal').classList.remove('hidden');
            setTimeout(() => inputElement.focus(), 100);
        }

        document.getElementById('closeModalBtn').addEventListener('click', () => document.getElementById('reservaModal').classList.add('hidden'));

        document.getElementById('btnBorrar').addEventListener('click', () => {
            document.getElementById('inputNombre').value = ''; 
            document.getElementById('formReserva').dispatchEvent(new Event('submit')); 
        });

        document.getElementById('formReserva').addEventListener('submit', function(e) {
            e.preventDefault();
            const nombre = document.getElementById('inputNombre').value.trim();
            if (nombre !== '') localStorage.setItem('ultimoNombreCoches', nombre); 
            
            const btn = document.getElementById('btnConfirmar');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;

            fetch(SCRIPT_URL, { 
                method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify([{ fecha: reservaPendiente.fecha, nombre: nombre, coche: reservaPendiente.coche, turno: reservaPendiente.turno }]) 
            })
            .then(() => {
                if (nombre === '') reservasActivas.delete(reservaPendiente.id);
                else reservasActivas.set(reservaPendiente.id, nombre);
                renderApp();
                document.getElementById('reservaModal').classList.add('hidden');
            })
            .catch(e => alert("Error al guardar."))
            .finally(() => { btn.innerHTML = originalText; btn.disabled = false; });
        });

        function mostrarDatosCoche(cocheId, cocheAlias) {
            document.getElementById('infoCocheTitle').innerHTML = cocheAlias.replace('<br>', ' ');
            
            let htmlContent = "";
            let targetKey = Object.keys(infoCochesGlobal).find(k => k.toLowerCase().includes(cocheId.toLowerCase()));
            
            if (targetKey && infoCochesGlobal[targetKey] && infoCochesGlobal[targetKey].length > 0) {
                let lista = infoCochesGlobal[targetKey].map(dato => `<li class="mb-1"><i class="fas fa-check text-teal-500 mr-2"></i>${dato}</li>`).join('');
                htmlContent = `<ul class="text-left text-gray-700">${lista}</ul>`;
            } else {
                htmlContent = `<p class="text-center text-gray-500 mt-2">No hay datos registrados en Drive para este vehículo.</p>`;
            }
            
            document.getElementById('infoCocheContent').innerHTML = htmlContent;
            document.getElementById('infoCocheModal').classList.remove('hidden');
        }

        function cerrarInfoCoche() { document.getElementById('infoCocheModal').classList.add('hidden'); }

        window.onload = cargarDatos;

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(err => console.error(err));
    </script>
</body>
</html>
